# Деплой на Render.com: New → Blueprint → выбрать этот репозиторий.
# Диск нужен, чтобы PRO-коды и заказы не пропадали при перезапуске (тариф Starter).
services:
  - type: web
    name: kartochka-pro
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_FILE
        value: /var/data/store.json
      - key: BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
